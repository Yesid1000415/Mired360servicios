icado en oferta']],['internet','900 Megas','$89.900 /mes',['Velocidad simétrica según tecnología','Elige 1 app según oferta','Instalación sin costo indicada']],['tv','900 Megas + TV','$52.450 x 2 meses',['TV 89 canales','1 decodificador','Después $104.900 según oferta','Elige 1 plataforma']],['tv','900 Megas + TV + Streaming','$59.950 x 2 meses',['TV 89 canales','1 dongle + 1 decodificador','Escoge 2 apps','Después $119.900 según oferta']],['tv','Internet + TV','$109.900 /mes',['500 a 900 Megas según cobertura','TV básica','1 deco HD + 1 dongle']],['tv','900 Megas + TV Avanzada','$129.900 /mes',['Televisión avanzada','Netflix o Prime + Win+ según pieza','McAfee Premium']],['tv','900 Megas + TV + Voz','$111.900 /mes',['TV + deco HD','Telefonía nacional indicada','Elige 1 app']],['tv','900 Megas + TV + Voz Premium','$131.900 /mes',['Televisión avanzada','Telefonía ilimitada indicada','Netflix o Prime + Win+']]];let cat='internet';function wa(p){let t='Hola MIRED360SERVICIOS, me interesa '+p[1]+' ('+p[2]+'). Quiero validar cobertura.\nCiudad: ____\nDirección: ____\nBarrio/conjunto: ____';window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(t),'_blank')}function render(){document.querySelectorAll('[data-cat]').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));grid.innerHTML=plans.filter(p=>p[0]===cat).map((p,i)=>'<article class="card"><div class="head" onclick="this.nextElementSibling.classList.toggle(\'open\')"><b>'+p[1]+'</b><div class="price">'+p[2]+'</div><small>Toca para ver características +</small></div><div class="details"><ul>'+p[3].map(x=>'<li>'+x+'</li>').join('')+'</ul><button class="btn wa" onclick="wa(plans.filter(x=>x[0]===cat)['+i+'])">Quiero este plan</button></div></article>').join('')}document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()});render();</script></body></html>
