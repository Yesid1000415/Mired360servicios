text-align:left;min-width:650px}.table th{font-size:10px;text-transform:uppercase;letter-spacing:.9px;background:#f9faff;color:#91a0b1;padding:13px 15px}.table td{padding:14px 15px;border-top:1px solid #eef0f5;font-size:12px}.table td strong{font-size:13px}.headrow{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}.empty{text-align:center;padding:40px 20px;color:#8493a9}.empty b{display:block;color:#3a4a62;margin:8px 0}.fieldgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.wide{grid-column:1/-1}.fieldgrid .btn{justify-self:start}.hero{background:linear-gradient(113deg,#17264a,#3c388d 65%,#6555cf);color:#fff;padding:27px;border-radius:18px;overflow:hidden;position:relative;margin-bottom:17px}.hero:after{content:'';height:220px;width:220px;border-radius:50%;border:38px solid #ffffff16;position:absolute;right:-50px;top:-100px}.hero p{color:#c6cdfa;margin-top:8px;font-size:13px}.hero .btn{margin-top:18px;background:white;color:#343396}.tag{display:inline-flex;gap:7px;align-items:center;font-size:11px;color:#9b95ff;font-weight:850;letter-spacing:.8px}.overlay{position:fixed;inset:0;background:#0b1024a8;display:none;align-items:center;justify-content:center;padding:15px;z-index:8}.overlay.show{display:flex}.dialog{width:min(600px,100%);max-height:90dvh;overflow:auto;background:white;border-radius:19px;padding:25px;box-shadow:0 25px 90px #0003}.dialog h2{margin-bottom:20px}.toasts{position:fixed;bottom:17px;right:18px;z-index:12;display:grid;gap:8px}.toast{max-width:350px;padding:12px 16px;background:#15213b;color:white;border-radius:11px;font-size:12px;box-shadow:0 6px 20px #101b3545}.autharea{min-height:100dvh;display:grid;grid-template-columns:1fr 1fr}.authvisual{background:linear-gradient(150deg,#111b36,#373388,#6a5af3);color:white;padding:10%;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}.authvisual h1{font-size:clamp(35px,4vw,61px);line-height:1.06;letter-spacing:-2.5px}.authvisual p{color:#ccd4ff;margin-top:17px;max-width:430px}.authvisual .cardfake{background:#ffffff14;border:1px solid #ffffff24;border-radius:19px;padding:23px;max-width:380px;backdrop-filter:blur(12px)}.authcontent{display:grid;place-items:center;padding:27px}.authcard{max-width:410px;width:100%}.authcard h2{font-size:28px;letter-spacing:-1px;margin-bottom:7px}.authcard p{font-size:13px;margin-bottom:27px}.authcard label{margin-top:15px}.authcard .btn{width:100%;margin-top:19px}.warning{background:#fff9e9;color:#846521;border:1px solid #f3e0a8;padding:13px 15px;border-radius:10px;font-size:12px;margin:16px 0;line-height:1.6}.btnlink{background:none;color:#6157d6;padding:8px 0;margin-top:8px;font-weight:750;font-size:12px}.mobilebar{display:none}.role{font-size:10px;color:#a09aff;letter-spacing:1px;text-transform:uppercase}.banner{background:#eef8ff;border:1px solid #d3eafa;color:#2c557a;padding:13px 16px;border-radius:12px;font-size:12px;margin-bottom:15px}

</head><body><div id="app"></div><div id="modal" class="overlay"></div><div id="toasts" class="toasts" aria-live="polite"></div>
<script type="module">
const config=window.MIRED360_CLOUD||{};
const validConfig=/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(config.url||'') && config.publishableKey && !config.publishableKey.includes('CAMBIAR');
let db=null,session=null,tiendas=[],tienda=null,sucursales=[],productos=[],pedidos=[],miembros=[],tab='resumen',busy=false;
const $=(s)=>document.querySelector(s), esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=v=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Number(v||0));
function toast(msg){let el=document.createElement('div');el.className='toast';el.textContent=msg;$('#toasts').append(el);setTimeout(()=>el.remove(),5000)}
function icon(v){return {resumen:'◫',pedidos:'▤',productos:'◈',sucursales:'▣',equipo:'♧',configuracion:'⚙'}[v]||'◈'}
function btn(text,onclick,kind=''){return `<button class="btn ${kind}" data-act="${onclick}">${text}</button>`}
function role(){return miembros.find(x=>x.tienda_id===tienda?.id && x.usuario_id===session?.user.id)?.rol||''}
function empty(txt='Aún no hay registros'){return `<div class="empty"><div style="font-size:32px">◇</div><b>${esc(txt)}</b><span class="small">Cuando agregues información aparecerá aquí.</span></div>`}
function panelTitle(title,sub,actions=''){return `<div class="headrow"><div><h1>${title}</h1><p class="small muted" style="margin-top:6px">${sub}</p></div><div class="flex">${actions}</div></div>`}
function render(){if(!validConfig)return renderSetup();if(!session||window.authMode==='newpass')return renderAuth();renderPanel()}
function renderSetup(){$('#app').innerHTML=`<main class="autharea"><section class="authvisual"><div class="logo"><span class="logoIcon">M</span>MIRED360 <small>TIENDAS PRO</small></div><div><div class="tag">COMMERCE OPERATING SYSTEM</div><h1>Una nueva manera de dirigir tu comercio.</h1><p>Todos tus negocios, sucursales, productos y vendedores bajo un solo centro de control.</p></div></section><section class="authcontent"><div class="authcard"><span class="pill">IMPLEMENTACIÓN SEGURA</span><h2 style="margin-top:15px">Panel en la nube</h2><p>Esta edición requiere una base de datos propia de MIRED360 TIENDAS antes de operar con cuentas y pedidos reales.</p><div class="warning"><strong>Conexión todavía no configurada.</strong> Debes crear el proyecto Supabase independiente, instalar la migración SQL y completar los valores públicos de <code>config.js</code>. No uses datos de clientes en la demostración.</div><a class="btn primary" style="display:flex" href="../tiendas-pro.html">Explorar demostración visual</a></div></section></main>`}
function renderAuth(){let mode=window.authMode||'signin';$('#app').innerHTML=`<main class="autharea"><section class="authvisual"><div class="logo"><span class="logoIcon">M</span><div>MIRED360<small>TIENDAS PRO</small></div></div><div><div class="tag">OPERACIÓN COMERCIAL INTELIGENTE</div><h1>Tu negocio, en perspectiva.</h1><p>Concentra tus sucursales y a tu equipo en una plataforma que crece contigo.</p></div><div class="cardfake"><div class="tiny">VISIÓN EMPRESARIAL</div><h2 style="font-size:29px;margin-top:10px">Una sola dirección.</h2><p>Tu equipo vende. Tú tienes el control.</p></div></section><section class="authcontent"><form id="authform" class="authcard"><span class="pill">ACCESO EMPRESARIAL</span><h2 style="margin-top:15px">${mode==='signup'?'Crea tu cuenta':mode==='reset'?'Recupera tu acceso':mode==='newpass'?'Define tu contraseña':'Bienvenido de nuevo'}</h2><p>${mode==='newpass'?'Tu invitación está lista. Configura una contraseña privada.':'Ingresa a tu centro de operaciones MIRED360.'}</p>${mode==='newpass'?'':`<label>Correo electrónico</label><input type="email" name="email" autocomplete="email" required placeholder="tu@empresa.com">`}${mode==='reset'?'':'<label>Contraseña</label>'}${mode==='reset'?'':`<input name="password" type="password" minlength="8" autocomplete="${mode==='signup'?'new-password':'current-password'}" required placeholder="Mínimo 8 caracteres">`}<button class="btn primary" type="submit" ${busy?'disabled':''}>${mode==='signup'?'Crear cuenta':mode==='reset'?'Enviar recuperación':mode==='newpass'?'Guardar contraseña':'Iniciar sesión'}</button><div class="flex between" style="margin-top:15px"><button class="btnlink" type="button" data-auth="${mode==='signup'?'signin':'signup'}">${mode==='signup'?'Ya tengo cuenta':'Crear una cuenta'}</button><button class="btnlink" type="button" data-auth="${mode==='reset'?'signin':'reset'}">${mode==='reset'?'Volver':'Olvidé mi contraseña'}</button></div></form></section></main>`;$('#authform').onsubmit=submitAuth}
async function submitAuth(e){e.preventDefault();let mode=window.authMode||'signin',f=new FormData(e.target);let email=String(f.get('email')||'').trim(),password=String(f.get('password')||'');busy=true;let res;
if(mode==='signup')res=await db.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});
else if(mode==='reset')res=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
else if(mode==='newpass')res=await db.auth.updateUser({password});
else res=await db.auth.signInWithPassword({email,password});busy=false;
if(res.error){toast(res.error.message);renderAuth();return}if(mode==='signup'){window.authMode='signin';toast('Registro recibido. Revisa tu correo para confirmar la cuenta; después inicia sesión.')}if(mode==='reset')toast('Consulta tu correo para recuperar tu acceso.');if(mode==='newpass'){window.authMode='signin';toast('Contraseña actualizada.');history.replaceState({},'',location.pathname)}if(res.data?.session){session=res.data.session;await loadAll()}render()}
async function loadAll(){if(!db||!session)return;let memb=await db.from('miembros').select('*').eq('activo',true);if(memb.error){toast(memb.error.message);return}miembros=memb.data||[];let shops=await db.from('tiendas').select('*').order('created_at',{ascending:false});if(shops.error){toast(shops.error.message);return}tiendas=shops.data||[];tienda=tiendas.find(t=>t.id===tienda?.id)||tiendas[0]||null;if(!tienda){sucursales=[];productos=[];pedidos=[];return}let [bs,ps,os,ms]=await Promise.all([db.from('sucursales').select('*').eq('tienda_id',tienda.id).order('created_at'),db.from('productos').select('*').eq('tienda_id',tienda.id).order('created_at',{ascending:false}),db.from('pedidos').select('*').eq('tienda_id',tienda.id).order('created_at',{ascending:false}).limit(300),db.from('miembros').select('*').eq('tienda_id',tienda.id)]);for(let x of [bs,ps,os,ms])if(x.error)toast(x.error.message);sucursales=bs.data||[];productos=ps.data||[];pedidos=os.data||[];miembros=(miembros.filter(x=>x.tienda_id!==tienda.id)).concat(ms.data||[])}
function linkSucursal(id,advisor){let u=new URL('tienda.html',location.href);u.searchParams.set('tienda',tienda.slug);u.searchParams.set('sucursal',id);if(advisor)u.searchParams.set('asesor',advisor);return u.href}
function renderPanel(){let r=role(),owner=r==='propietario',nav=[['resumen','Resumen'],['pedidos','Pedidos'],['productos','Productos'],['sucursales','Sucursales'],['equipo','Equipo'],['configuracion','Configuración']].filter(([k])=>owner||['resumen','pedidos'].includes(k));$('#app').innerHTML=`<div class="shell"><aside class="side"><div class="logo"><span class="logoIcon">M</span><div>MIRED360<small>TIENDAS PRO</small></div></div><div class="navhint">CENTRO DE OPERACIONES</div>${nav.map(([k,t])=>`<button class="nav ${tab===k?'sel':''}" data-nav="${k}"><span>${icon(k)}</span>${t}</button>`).join('')}<div class="sidefoot"><span class="role">${esc(r)}</span><h3 style="margin-top:6px;color:white">${esc(tienda?.nombre||'Tu primera tienda')}</h3><p>Operación centralizada y segura</p></div></aside><div class="work"><header class="top"><div><div class="tiny muted">MIRED360 / ESPACIO DE TRABAJO</div><strong>${esc(tienda?.nombre||'Crea tu negocio')}</strong></div><div class="flex"><select id="tiendaSelect" aria-label="Seleccionar tienda" style="max-width:180px;padding:9px">${tiendas.length?tiendas.map(t=>`<option value="${esc(t.id)}" ${t.id===tienda?.id?'selected':''}>${esc(t.nombre)}</option>`).join(''):'<option>Sin tiendas</option>'}</select><span class="avatar">${esc((session.user.email||'M')[0].toUpperCase())}</span><button class="btn" data-act="logout">Salir</button></div></header><main class="main">${!tienda?firstShop():page()}</main></div></div><nav class="mobilebar">${nav.slice(0,5).map(([k,t])=>`<button class="${tab===k?'sel':''}" data-nav="${k}"><span>${icon(k)}</span>${t}</button>`).join('')}</nav>`;$('#tiendaSelect')?.addEventListener('change',async e=>{tienda=tiendas.find(x=>x.id===e.target.value);await loadAll();render()});}
function firstShop(){return `<div class="hero"><span class="tag">BIENVENIDO A MIRED360</span><h1 style="margin-top:8px">Comienza con tu primera tienda.</h1><p>Tu negocio tendrá un espacio propio con catálogo, sedes y colaboradores.</p></div><div class="surface pad" style="max-width:700px"><h2>Registrar mi negocio</h2><p class="small muted" style="margin:9px 0 18px">La tienda se crea inicialmente privada y sin acceso público.</p><form id="crearTienda" class="fieldgrid"><div><label>Nombre de la empresa</label><input name="nombre" required minlength="3" placeholder="Mi negocio"></div><div><label>Identificador web</label><input name="slug" required pattern="[a-z0-9-]{3,50}" placeholder="mi-negocio"></div><div><label>WhatsApp comercial</label><input name="whatsapp" pattern="[0-9+ ]{7,20}" placeholder="3229432085"></div><div style="align-self:end"><button class="btn primary" type="submit">Crear mi tienda</button></div></form></div>`}
function page(){if(tab==='pedidos')return orders();if(tab==='productos')return products();if(tab==='sucursales')return branches();if(tab==='equipo')return team();if(tab==='configuracion')return settings();return dashboard()}
function dashboard(){let complete=pedidos.filter(x=>x.estado==='completado'),total=complete.reduce((s,x)=>s+Number(x.total_cop),0),pending=pedidos.filter(x=>x.estado==='pendiente').length;return `${panelTitle('Tu negocio, en perspectiva.','Resumen operacional de '+esc(tienda.nombre),btn('↻ Actualizar','refresh'))}<div class="hero"><span class="tag">◇ TU PANEL CENTRAL</span><h2 style="font-size:25px;margin-top:13px">Cada venta cuenta. Cada sucursal importa.</h2><p>Visualiza tus pedidos, tus colaboradores y la evolución de tu operación desde un mismo lugar.</p>${role()==='propietario'?btn('＋ Crear producto','newProduct'):''}</div><div class="grid statgrid">${[['◉','Ventas completadas',money(total)],['▤','Pedidos registrados',pedidos.length],['◷','Pendientes',pending],['▣','Sucursales activas',sucursales.filter(x=>x.activa).length]].map(([i,t,n])=>`<div class="surface stat"><em>${i}</em><div class="muted small">${t}</div><div class="number">${n}</div></div>`).join('')}</div><div class="chart"><div class="surface pad"><div class="headrow"><h2>Actividad reciente</h2>${btn('Ver pedidos','view:pedidos')}</div>${pedidos.length?pedidos.slice(0,5).map(x=>`<div class="feedItem"><div><b>${esc(x.cliente_nombre)}</b><p class="tiny">${esc(x.estado)} · ${new Date(x.created_at).toLocaleDateString('es-CO')}</p></div><b>${money(x.total_cop)}</b></div>`).join(''):empty('Aún no hay pedidos reales')}</div><div class="surface pad"><div class="headrow"><h2>Tus sucursales</h2>${role()==='propietario'?btn('Crear','newBranch'):''}</div>${sucursales.length?sucursales.slice(0,5).map(x=>`<div class="feedItem"><div><b>${esc(x.nombre)}</b><p class="tiny">${esc(x.ciudad||'Sucursal digital')}</p></div><span class="pill ${x.activa?'green':''}">${x.activa?'Activa':'Inactiva'}</span></div>`).join(''):empty('Crea tu primera sucursal')}</div></div>`}
function orders(){return `${panelTitle('Pedidos y ventas','Pedidos reales autorizados por tu rol',btn('↻ Actualizar','refresh'))}<div class="surface tablebox">${pedidos.length?`<table class="table"><thead><tr><th>Pedido</th><th>Cliente</th><th>Sucursal</th><th>Importe</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${pedidos.map(x=>`<tr><td><b>${esc(x.id.slice(0,8).toUpperCase())}</b><div class="tiny muted">${new Date(x.created_at).toLocaleDateString('es-CO')}</div></td><td><strong>${esc(x.cliente_nombre)}</strong><div class="tiny muted">${esc(x.cliente_ciudad)}</div></td><td>${esc(sucursales.find(s=>s.id===x.sucursal_id)?.nombre||'—')}</td><td><b>${money(x.total_cop)}</b></td><td><span class="pill ${x.estado==='completado'?'green':''}">${esc(x.estado)}</span></td><td>${role()!=='asesor'?btn('Cambiar estado','status:'+x.id):'<span class="muted">Consulta</span>'}</td></tr>`).join('')}</tbody></table>`:empty('Todavía no tienes pedidos sincronizados')}</div>`}
function products(){return `${panelTitle('Tu catálogo','Productos y servicios disponibles en tu negocio',btn('＋ Nuevo producto','newProduct','primary'))}<div class="surface tablebox">${productos.length?`<table class="table"><thead><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Inventario</th><th>Publicación</th></tr></thead><tbody>${productos.map(x=>`<tr><td><strong>${esc(x.nombre)}</strong><div class="tiny muted">${esc(x.tipo)}</div></td><td>${esc(x.categoria)}</td><td><b>${money(x.precio_cop)}</b></td><td>${x.tipo==='servicio'?'No aplica':x.inventario}</td><td><span class="pill ${x.publicada?'green':''}">${x.publicada?'Visible':'Borrador'}</span></td></tr>`).join('')}</tbody></table>`:empty('Crea tu primer producto')}</div>`}
function branches(){return `${panelTitle('Sucursales','Organiza sedes físicas y equipos digitales',btn('＋ Crear sucursal','newBranch','primary'))}<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${sucursales.length?sucursales.map(x=>`<div class="surface pad"><span class="pill green">SUCURSAL</span><h2 style="margin-top:18px">${esc(x.nombre)}</h2><p class="small" style="margin:10px 0">${esc(x.ciudad||'Operación digital')}</p><div class="flex between" style="margin-top:22px"><span class="tiny muted">${esc(x.whatsapp||'Sin WhatsApp asignado')}</span><span class="pill ${x.activa?'green':''}">${x.activa?'Activa':'Inactiva'}</span></div><button class="btn" style="margin-top:15px;width:100%" data-copy="${esc(linkSucursal(x.id))}">Copiar enlace de esta sucursal</button></div>`).join(''):empty('Todavía no has creado sucursales')}</div>`}
function team(){return `${panelTitle('Equipo comercial','Asesores y responsables con permisos por sucursal',btn('＋ Invitar colaborador','invite','primary'))}<div class="banner">Invita a un asesor con su correo: si no tiene cuenta, recibirá un enlace para configurar el acceso.</div><div class="surface tablebox">${miembros.length?`<table class="table"><thead><tr><th>Integrante</th><th>Rol</th><th>Sucursal</th><th>Estado</th></tr></thead><tbody>${miembros.map(x=>`<tr><td><strong>${esc(x.nombre_visible||x.email_contacto||x.usuario_id.slice(0,8))}</strong><div class="tiny muted">${esc(x.email_contacto)}</div></td><td>${esc(x.rol)}</td><td>${esc(sucursales.find(s=>s.id===x.sucursal_id)?.nombre||'Administración central')}</td><td><span class="pill ${x.activo?'green':''}">${x.activo?'Activo':'Inactivo'}</span>${x.rol==='asesor'&&x.sucursal_id?`<button class="btn" style="margin-left:7px" data-copy="${esc(linkSucursal(x.sucursal_id,x.usuario_id))}">Copiar enlace</button>`:''}</td></tr>`).join('')}</tbody></table>`:empty('No hay colaboradores')}</div>`}
function settings(){return `${panelTitle('Configuración','Datos de tu tienda y publicación pública')}<div class="surface pad" style="max-width:740px"><form id="settingsForm" class="fieldgrid"><div class="wide"><label>Nombre comercial</label><input name="nombre" value="${esc(tienda.nombre)}" required minlength="3"></div><div><label>WhatsApp</label><input name="whatsapp" value="${esc(tienda.whatsapp)}"></div><div><label>Identificador web</label><input value="${esc(tienda.slug)}" disabled></div><div class="wide"><label><input name="publicada" type="checkbox" style="width:auto" ${tienda.publicada?'checked':''}> Habilitar catálogo público</label><p class="tiny">La publicación requiere una sucursal y al menos un producto activo.</p></div><button class="btn primary">Guardar cambios</button></form></div>`}
function popup(title,fields,kind){$('#modal').className='overlay show';$('#modal').innerHTML=`<div class="dialog"><div class="headrow"><h2>${title}</h2><button class="btn" data-act="close">✕</button></div><form id="popupForm" class="fieldgrid">${fields}<div class="wide flex" style="justify-content:end">${btn('Cancelar','close')}<button class="btn primary" type="submit">Guardar</button></div></form></div>`;$('#popupForm').dataset.kind=kind}
function field(title,name,placeholder='',type='text',extra=''){return `<div><label>${title}</label><input name="${name}" type="${type}" placeholder="${placeholder}" ${extra}></div>`}
function openModal(action){if(action==='newBranch')popup('Nueva sucursal',field('Nombre de la sucursal','nombre','Sucursal principal','text','required minlength="2"')+field('Ciudad / zona','ciudad','Madrid, Cundinamarca')+field('WhatsApp','whatsapp','3229432085','tel'),'branch');
if(action==='newProduct')popup('Nuevo producto o servicio',field('Nombre del producto','nombre','Internet fibra 900 megas','text','required minlength="2"')+field('Categoría','categoria','Internet hogar')+field('Precio COP','precio','79900','number','required min="0"')+`<div><label>Tipo</label><select name="tipo"><option value="servicio">Servicio</option><option value="producto">Producto físico</option></select></div>`+field('Inventario físico','inventario','0','number','min="0" value="0"')+`<div><label><input type="checkbox" name="publicada" style="width:auto"> Publicar en la tienda</label></div>`,'product');
if(action==='invite')popup('Invitar colaborador',field('Nombre del colaborador','nombre','Nombre visible','text','required')+field('Correo electrónico','email','correo@empresa.com','email','required')+`<div><label>Rol</label><select name="rol"><option value="asesor">Asesor comercial</option><option value="encargado">Encargado de sucursal</option></select></div><div><label>Asignar a sucursal</label><select required name="sucursal_id"><option value="">Elegir sucursal</option>${sucursales.map(x=>`<option value="${esc(x.id)}">${esc(x.nombre)}</option>`).join('')}</select></div>`,'invite');
if(action.startsWith('status:')){let id=action.slice(7),o=pedidos.find(x=>x.id===id);if(!o)return;popup('Estado del pedido',`<div class="wide"><label>Estado</label><select name="estado">${['pendiente','confirmado','en_proceso','completado','cancelado'].map(x=>`<option ${o.estado===x?'selected':''} value="${x}">${x.replace('_',' ')}</option>`).join('')}</select><input type="hidden" name="id" value="${esc(o.id)}"></div>`,'status') }}
async function doPopup(form){const kind=form.dataset.kind,f=new FormData(form),v=Object.fromEntries(f.entries());let r;if(kind==='branch')r=await db.from('sucursales').insert({tienda_id:tienda.id,nombre:v.nombre,ciudad:v.ciudad||'',whatsapp:v.whatsapp||''});if(kind==='product')r=await db.from('productos').insert({tienda_id:tienda.id,nombre:v.nombre,categoria:v.categoria||'General',precio_cop:Number(v.precio),inventario:Number(v.inventario||0),tipo:v.tipo,publicada:f.has('publicada')});if(kind==='status')r=await db.from('pedidos').update({estado:v.estado}).eq('id',v.id).eq('tienda_id',tienda.id);if(kind==='invite'){const {data,error}=await db.functions.invoke('invitar-miembro',{body:{tienda_id:tienda.id,sucursal_id:v.sucursal_id,rol:v.rol,nombre:v.nombre,email:v.email}});r={error:error||(data?.error?{message:data.error}:null)};}if(r?.error){toast(r.error.message||String(r.error));return}$('#modal').className='overlay';toast('Guardado correctamente');await loadAll();render()}
async function submitMainForm(e){if(e.target.id==='crearTienda'){e.preventDefault();let f=new FormData(e.target),r=await db.from('tiendas').insert({propietario_id:session.user.id,nombre:f.get('nombre'),slug:f.get('slug'),whatsapp:f.get('whatsapp')||''}).select('id').single();if(r.error){toast(r.error.message);return}toast('Tu tienda fue creada');await loadAll();render()}if(e.target.id==='settingsForm'){e.preventDefault();let f=new FormData(e.target),r=await db.from('tiendas').update({nombre:f.get('nombre'),whatsapp:f.get('whatsapp')||'',publicada:f.has('publicada')}).eq('id',tienda.id);if(r.error){toast(r.error.message);return}toast('Configuración actualizada');await loadAll();render()}}
document.addEventListener('submit',e=>{if(e.target.id==='popupForm'){e.preventDefault();doPopup(e.target)}else if(e.target.id==='crearTienda'||e.target.id==='settingsForm')submitMainForm(e)});
document.addEventListener('click',async e=>{const copyBtn=e.target.closest('[data-copy]');if(copyBtn){try{await navigator.clipboard.writeText(copyBtn.dataset.copy);toast('Enlace comercial copiado')}catch{toast('No fue posible copiar automáticamente. Revisa permisos del navegador.')}return}const auth=e.target.closest('[data-auth]');if(auth){window.authMode=auth.dataset.auth;renderAuth();return}const nav=e.target.closest('[data-nav]');if(nav){tab=nav.dataset.nav;render();return}const btn=e.target.closest('[data-act]');if(!btn)return;const a=btn.dataset.act;if(a==='close'){$('#modal').className='overlay';return}if(a==='logout'){await db.auth.signOut();session=null;render();return}if(a==='refresh'){await loadAll();render();toast('Datos sincronizados');return}if(a.startsWith('view:')){tab=a.slice(5);render();return}openModal(a)});
if(validConfig){try{const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/+esm');db=createClient(config.url,config.publishableKey);let {data}=await db.auth.getSession();session=data.session;db.auth.onAuthStateChange((event,s)=>{session=s;if(event==='PASSWORD_RECOVERY'){window.authMode='newpass';renderAuth();return}setTimeout(async()=>{if(session)await loadAll();render()},0)});if(session){if(location.hash.includes('type=invite')||location.hash.includes('type=recovery'))window.authMode='newpass';await loadAll()}render()}catch(e){toast('Error de conexión. Revisa configuración y acceso a internet.');console.error(e);renderSetup()}}else render();
</script></body></html>
