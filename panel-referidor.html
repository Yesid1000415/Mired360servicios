<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi panel de referidos | MIRED360SERVICIOS</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#071a32;font-family:Arial,sans-serif}.top{background:#fff;padding:16px 20px;border-bottom:1px solid #e4e8ef;position:sticky;top:0}.logo{font-weight:900;font-size:24px;color:#0754b8}.logo span{color:#ff7a00}.wrap{max-width:760px;margin:auto;padding:22px 16px}.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 8px 24px #0b285214}.hero{background:linear-gradient(135deg,#eaf4ff,#fff)}h1,h2{margin:0 0 10px}.login input,.login button{width:100%;padding:14px;border-radius:12px;margin:7px 0}.login input{border:1px solid #ccd6e3;font-size:16px}.login button,.red{background:#ef171d;color:#fff;border:0;font-weight:900}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#fff;border-radius:16px;padding:17px;box-shadow:0 5px 18px #0b285214}.num{font-size:25px;font-weight:900;color:#0754b8}.money{color:#07862d}.pending{color:#e18b00}.btn{display:block;text-align:center;text-decoration:none;padding:15px;border-radius:13px;margin:18px 0}.item{background:#fff;border-radius:15px;padding:16px;margin:10px 0;border:1px solid #e8edf4}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{padding:7px 10px;border-radius:20px;background:#eaf1fb;font-size:12px;font-weight:900}.tag.pagado,.tag.instalado{background:#daf6e1;color:#08772a}.tag.venta{background:#dbeafe;color:#0754b8}.tag.contactado{background:#fff1bf;color:#8a6300}.muted{color:#66758a;font-size:13px}.hide{display:none}.error{color:#b00020;font-weight:700}.logout{float:right;border:0;background:none;color:#0754b8;font-weight:800}</style></head><body>
<div class="top"><div class="logo">MIRED<span>360</span><small style="font-size:9px;display:block;letter-spacing:3px">SERVICIOS</small></div></div>
<main class="wrap"><section id="login" class="card hero login"><h1>Mi panel de referidos</h1><p>Consulta tus clientes, instalaciones, ganancias y pagos.</p><input id="codigo" placeholder="Código MR360-..." autocomplete="username"><input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="Tu clave de 4 a 6 números" autocomplete="current-password"><button id="entrar">ENTRAR A MI PANEL</button><p id="msg" class="error"></p><p class="muted">¿Aún no eres referidor? <a href="referidores.html">Regístrate aquí</a>.</p></section>
<section id="panel" class="hide"><div class="card hero"><button class="logout" onclick="salir()">Salir</button><div class="muted">Bienvenido a tu panel</div><h1 id="nombre"></h1><div>Tu código: <strong id="miCodigo"></strong></div></div>
<div class="stats"><div class="stat"><div class="num" id="total">0</div><div>Mis referidos</div></div><div class="stat"><div class="num money" id="inst">0</div><div>Instalados</div></div><div class="stat"><div class="num money" id="ganado">$0</div><div>Total pagado</div></div><div class="stat"><div class="num pending" id="pend">$0</div><div>Por pagar</div></div></div>
<a class="btn red" href="referidores.html#nuevoReferido">＋ REGISTRAR NUEVO REFERIDO</a>
<h2>Mis referidos</h2><div id="lista"></div></section></main>
<script>
const URL='https://lpiusomsuswdcraoozdn.supabase.co/functions/v1/panel-referidor',KEY='sb_publishable_ZFjdUsgyfSxOqm4L1SrJJg_Z2f0lL0r';
const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function cargar(c,p){
 const msg=document.getElementById('msg');msg.textContent='Consultando...';
 try{const r=await fetch(URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({codigo:c.toUpperCase().trim(),pin:p.trim()})});const d=await r.json();if(!r.ok)throw Error(d.error||'No fue posible ingresar');
 document.getElementById('login').classList.add('hide');document.getElementById('panel').classList.remove('hide');document.getElementById('nombre').textContent='Hola, '+d.referidor.nombre.split(' ')[0];document.getElementById('miCodigo').textContent=d.referidor.codigo;document.getElementById('total').textContent=d.resumen.total;document.getElementById('inst').textContent=d.resumen.instalados;document.getElementById('ganado').textContent=money(d.resumen.ganado);document.getElementById('pend').textContent=money(d.resumen.por_pagar);
 document.getElementById('lista').innerHTML=d.referidos.length?d.referidos.map(x=>'<div class="item"><div class="row"><strong>'+esc(x.nombre_referido)+'</strong><span class="tag '+esc(x.estado).toLowerCase().replaceAll(' ','-')+'">'+esc(x.estado).toUpperCase()+'</span></div><div class="muted">📍 '+esc(x.ciudad)+(x.barrio?' · '+esc(x.barrio):'')+'</div><div class="row" style="margin-top:9px"><span>Comisión</span><strong>'+money(x.valor_comision)+'</strong></div>'+(x.fecha_instalacion?'<div class="muted">Instalado: '+esc(x.fecha_instalacion)+'</div>':'')+(x.fecha_pago?'<div class="muted">Pagado: '+esc(x.fecha_pago)+'</div>':'')+'</div>').join(''):'<div class="card">Aún no tienes referidos registrados.</div>';
 sessionStorage.setItem('mr360code',c);sessionStorage.setItem('mr360pin',p);msg.textContent='';
 }catch(e){msg.textContent=e.message}}
document.getElementById('entrar').onclick=()=>cargar(document.getElementById('codigo').value,document.getElementById('pin').value);
function salir(){sessionStorage.clear();location.reload()}
const c=sessionStorage.getItem('mr360code'),p=sessionStorage.getItem('mr360pin');if(c&&p)cargar(c,p);
</script></body></html>
