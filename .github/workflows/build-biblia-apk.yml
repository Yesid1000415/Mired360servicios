name: Build Biblia IPUIC APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "biblia.html"
      - "android-biblia/**"
      - ".github/workflows/build-biblia-apk.yml"
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare isolated application
        run: |
          mkdir -p "$RUNNER_TEMP/biblia-build/www"
          cp android-biblia/package.json android-biblia/capacitor.config.json "$RUNNER_TEMP/biblia-build/"
          cp biblia.html "$RUNNER_TEMP/biblia-build/www/index.html"
      - name: Install Capacitor
        working-directory: ${{ runner.temp }}/biblia-build
        run: npm install --no-audit --no-fund
      - name: Generate Android application
        working-directory: ${{ runner.temp }}/biblia-build
        run: |
          npx cap add android
          npx cap sync android
      - name: Set application icon
        run: |
          mkdir -p "$RUNNER_TEMP/biblia-build/android/app/src/main/res/drawable"
          cp android-biblia/icon.xml "$RUNNER_TEMP/biblia-build/android/app/src/main/res/drawable/ic_biblia.xml"
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'biblia-build/android/app/src/main/AndroidManifest.xml'
          text=p.read_text().replace('@mipmap/ic_launcher_round','@drawable/ic_biblia').replace('@mipmap/ic_launcher','@drawable/ic_biblia')
          p.write_text(text)
          PY
      - name: Build and verify signed test APK
        working-directory: ${{ runner.temp }}/biblia-build/android
        run: |
          ./gradlew assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
      - name: Prepare download
        run: |
          cp "$RUNNER_TEMP/biblia-build/android/app/build/outputs/apk/debug/app-debug.apk" Biblia-IPUIC-Prueba.apk
          sha256sum Biblia-IPUIC-Prueba.apk > SHA256SUMS.txt
          git rev-parse HEAD > SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Biblia-IPUIC-APK
          path: |
            Biblia-IPUIC-Prueba.apk
            SHA256SUMS.txt
            SOURCE_COMMIT.txt
          if-no-files-found: error
          retention-days: 30
