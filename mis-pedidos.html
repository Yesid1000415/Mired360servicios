<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis pedidos | MIRED360</title><link rel="stylesheet" href="styles.css"><style>.orderbox{max-width:650px;margin:auto;padding:28px;border:1px solid #dce7f2;border-radius:20px;background:#fff;color:#071a33}.orderbox input{width:100%;padding:15px;border:1px solid #c9d8e7;border-radius:12px;margin:12px 0}.orderbox button{width:100%;padding:15px;border:0;border-radius:12px;background:#087bff;color:#fff;font-weight:800}.orderstatus{margin-top:18px;padding:16px;border-radius:12px;background:#f5f9ff}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><b>MIRED<span>360</span></b><small>SERVICIOS</small></a><nav><a href="index.html#tienda">Tienda</a><a href="mi-cuenta.html">Mi cuenta</a></nav></div></header><main><section class="section"><div class="wrap"><div class="head"><div class="pill">MIS PEDIDOS</div><h1>Consulta tu compra</h1><p>Ingresa el número de pedido MIRED360 recibido al finalizar tu compra.</p></div><div class="orderbox"><label for="pedido"><b>Número de pedido</b></label><input id="pedido" placeholder="Ej. MR-XXXXXXXX-XXXXXX" autocomplete="off"><button onclick="consultar()">Consultar pedido</button><div id="resultado" class="orderstatus" hidden></div><p style="font-size:.85rem">Los datáfonos tienen un tiempo estimado de entrega de 2 a 8 días hábiles, según la ciudad o municipio.</p></div></div></section></main><script>function consultar(){const p=document.getElementById('pedido').value.trim();const r=document.getElementById('resultado');r.hidden=false;if(!p){r.textContent='Ingresa tu número de pedido.';return}localStorage.setItem('mired360_last_order',p);r.innerHTML='<b>Pedido '+p.replace(/[<>]/g,'')+'</b><br>Estamos preparando la consulta automática del estado logístico. Si tu pago ya fue aprobado, conserva este número para el seguimiento.'}</script></body></html>
