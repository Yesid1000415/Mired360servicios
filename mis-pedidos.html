<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis pedidos | MIRED360</title><link rel="stylesheet" href="styles.css"><style>.orderbox{max-width:650px;margin:auto;padding:28px;border:1px solid #dce7f2;border-radius:20px;background:#fff;color:#071a33}.orderbox input{width:100%;padding:15px;border:1px solid #c9d8e7;border-radius:12px;margin:12px 0}.orderbox button{width:100%;padding:15px;border:0;border-radius:12px;background:#087bff;color:#fff;font-weight:800}.orderstatus{margin-top:18px;padding:16px;border-radius:12px;background:#f5f9ff}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><b>MIRED<span>360</span></b><small>SERVICIOS</small></a><nav><a href="index.html#tienda">Tienda</a><a href="mi-cuenta.html">Mi cuenta</a></nav></div></header><main><section class="section"><div class="wrap"><div class="head"><div class="pill">MIS PEDIDOS</div><h1>Consulta tu compra</h1><p>Ingresa el número de pedido MIRED360 recibido al finalizar tu compra.</p></div><div class="orderbox"><label for="pedido"><b>Número de pedido</b></label><input id="pedido" placeholder="Ej. MR-XXXXXXXX-XXXXXX" autocomplete="off"><label for="email"><b>Correo usado en la compra</b></label><input id="email" type="email" placeholder="correo@ejemplo.com" autocomplete="email"><button onclick="consultar()">Consultar pedido</button><div id="resultado" class="orderstatus" hidden></div><p style="font-size:.85rem">Los datáfonos tienen un tiempo estimado de entrega de 2 a 8 días hábiles, según la ciudad o municipio.</p></div></div></section></main><script>
async function consultar(){
 const p=document.getElementById('pedido').value.trim(),e=document.getElementById('email').value.trim(),r=document.getElementById('resultado');r.hidden=false;
 if(!p||!e){r.textContent='Ingresa el número de pedido y el correo usado en la compra.';return}
 r.textContent='Consultando pedido…';
 try{
  const x=await fetch('https://lpiusomsuswdcraoozdn.supabase.co/functions/v1/consultar-pedido',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pedido:p,email:e})});
  const d=await x.json(); if(!x.ok) throw new Error(d.error||'No fue posible consultar.');
  const money=new Intl.NumberFormat('es-CO',{style:'currency',currency:d.moneda||'COP',maximumFractionDigits:0}).format(Number(d.valor||0));
  const pago=d.estado_pago==='aprobado'?'✅ Pago aprobado':'⏳ Pago: '+(d.estado_pago||'pendiente');
  const entrega=d.estado_entrega?('📦 Entrega: '+d.estado_entrega):'📦 Pedido recibido';
  r.innerHTML='<b>'+d.pedido+'</b><br>'+d.producto+' · '+money+'<br><br>'+pago+'<br>'+entrega;
  localStorage.setItem('mired360_last_order',d.pedido);
 }catch(err){r.textContent=err.message}
}</script></body></html>
