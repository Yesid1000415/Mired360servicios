<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carrito | MIRED360</title><link rel="stylesheet" href="styles.css"><style>.cart{max-width:800px;margin:auto}.item{display:grid;grid-template-columns:1fr auto;gap:14px;padding:18px;margin:12px 0;border:1px solid #dce7f2;border-radius:16px;background:#fff;color:#071a33}.qty button{padding:7px 11px}.total{font-size:1.35rem;font-weight:900;text-align:right;margin:22px 0}.cart-actions{display:flex;gap:10px;flex-wrap:wrap}.cart-actions a,.cart-actions button{padding:14px 18px;border-radius:12px;text-decoration:none;font-weight:800;border:0}.checkout{background:#087bff;color:#fff}.customer{padding:20px;border:1px solid #dce7f2;border-radius:16px;background:#fff;color:#071a33;margin-top:18px}.customer input{width:100%;padding:13px;border:1px solid #c9d8e7;border-radius:10px;margin:7px 0 13px}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><b>MIRED<span>360</span></b><small>SERVICIOS</small></a><nav><a href="index.html#tienda">Tienda</a><a href="mi-cuenta.html">Mi cuenta</a></nav></div></header><main><section class="section"><div class="wrap cart"><div class="head"><div class="pill">CARRITO</div><h1>Tu compra MIRED360</h1><p>Revisa los productos y continúa con un solo pago.</p></div><div id="items"></div><div id="total" class="total"></div><div id="customer" class="customer"><h3>Datos para el pedido</h3><label>Nombre completo</label><input id="nombre"><label>Celular</label><input id="telefono" inputmode="tel"><label>Correo electrónico</label><input id="email" type="email"></div><div class="cart-actions"><a href="index.html#tienda">← Seguir comprando</a><button id="pay" class="checkout" onclick="checkout()">Pagar carrito con Bold</button></div><p id="note"></p><div id="bold"></div></div></section></main><script src="https://checkout.bold.co/library/boldPaymentButton.js"></script><script>
function cart(){try{return JSON.parse(localStorage.getItem('mired360_cart')||'[]')}catch(e){return[]}}function save(c){localStorage.setItem('mired360_cart',JSON.stringify(c));render()}function change(s,d){let c=cart(),x=c.find(i=>i.sku===s);if(x)x.cantidad+=d;c=c.filter(i=>i.cantidad>0);save(c)}
function render(){const c=cart(),box=document.getElementById('items'),pay=document.getElementById('pay'),cust=document.getElementById('customer');if(!c.length){box.innerHTML='<div class="item"><b>Tu carrito está vacío.</b></div>';pay.style.display='none';cust.style.display='none';document.getElementById('total').textContent='';return}box.innerHTML=c.map(i=>'<div class="item"><div><b>'+i.nombre+'</b><br>$'+Number(i.precio).toLocaleString('es-CO')+'</div><div class="qty"><button onclick="change(\''+i.sku+'\',-1)">−</button> '+i.cantidad+' <button onclick="change(\''+i.sku+'\',1)">+</button></div></div>').join('');document.getElementById('total').textContent='Total estimado: $'+c.reduce((a,i)=>a+i.precio*i.cantidad,0).toLocaleString('es-CO')}
async function checkout(){const c=cart(),note=document.getElementById('note'),btn=document.getElementById('pay');if(!c.length)return;const nombre=document.getElementById('nombre').value.trim(),telefono=document.getElementById('telefono').value.trim(),email=document.getElementById('email').value.trim();if(nombre.length<3||telefono.replace(/\D/g,'').length<7||!email.includes('@')){note.textContent='Completa nombre, celular y correo.';return}btn.disabled=true;note.textContent='Validando productos y preparando pago seguro…';try{const r=await fetch('https://lpiusomsuswdcraoozdn.supabase.co/functions/v1/carrito-checkout-production',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre,telefono,email,items:c.map(i=>({sku:i.sku,cantidad:i.cantidad}))})});const x=await r.json();if(!r.ok||!x.ok)throw new Error(x.error||'No fue posible preparar la compra');const q=x.checkout;localStorage.setItem('mired360_last_order',x.pedido.numero);note.textContent='Pedido '+x.pedido.numero+' creado. Abriendo Bold…';const co=new window.BoldCheckout({orderId:q.orderId,currency:q.currency,amount:q.amount,apiKey:q.apiKey,integritySignature:q.integritySignature,description:q.description,redirectionUrl:q.redirectionUrl});co.open()}catch(e){note.textContent=e.message||'Error preparando el pago';btn.disabled=false}}
render();</script></body></html>
