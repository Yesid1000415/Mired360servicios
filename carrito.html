<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carrito | MIRED360</title><link rel="stylesheet" href="styles.css"><style>.cart{max-width:800px;margin:auto}.item{display:grid;grid-template-columns:1fr auto;gap:14px;padding:18px;margin:12px 0;border:1px solid #dce7f2;border-radius:16px;background:#fff;color:#071a33}.qty button{padding:7px 11px}.total{font-size:1.35rem;font-weight:900;text-align:right;margin:22px 0}.cart-actions{display:flex;gap:10px;flex-wrap:wrap}.cart-actions a,.cart-actions button{padding:14px 18px;border-radius:12px;text-decoration:none;font-weight:800;border:0}.checkout{background:#087bff;color:#fff}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><b>MIRED<span>360</span></b><small>SERVICIOS</small></a><nav><a href="index.html#tienda">Tienda</a><a href="mi-cuenta.html">Mi cuenta</a></nav></div></header><main><section class="section"><div class="wrap cart"><div class="head"><div class="pill">CARRITO</div><h1>Tu compra MIRED360</h1><p>Revisa tus productos antes de continuar.</p></div><div id="items"></div><div id="total" class="total"></div><div class="cart-actions"><a href="index.html#tienda">← Seguir comprando</a><button id="pay" class="checkout" onclick="checkout()">Continuar compra</button></div><p id="note" style="font-size:.86rem"></p></div></section></main><script>
function cart(){try{return JSON.parse(localStorage.getItem('mired360_cart')||'[]')}catch(e){return[]}}
function save(c){localStorage.setItem('mired360_cart',JSON.stringify(c));render()}
function change(s,d){let c=cart(),x=c.find(i=>i.sku===s);if(x)x.cantidad+=d;c=c.filter(i=>i.cantidad>0);save(c)}
function render(){const c=cart(),box=document.getElementById('items');if(!c.length){box.innerHTML='<div class="item"><b>Tu carrito está vacío.</b></div>';document.getElementById('pay').style.display='none';document.getElementById('total').textContent='';return}box.innerHTML=c.map(i=>'<div class="item"><div><b>'+i.nombre+'</b><br>$'+Number(i.precio).toLocaleString('es-CO')+'</div><div class="qty"><button onclick="change(\''+i.sku+'\',-1)">−</button> '+i.cantidad+' <button onclick="change(\''+i.sku+'\',1)">+</button></div></div>').join('');const t=c.reduce((a,i)=>a+i.precio*i.cantidad,0);document.getElementById('total').textContent='Total: $'+t.toLocaleString('es-CO');document.getElementById('note').textContent=c.length>1||c[0].cantidad>1?'El carrito múltiple ya está preparado. El pago unificado será habilitado en la siguiente etapa; por ahora puedes comprar cada producto con el checkout seguro existente.':''}
function checkout(){const c=cart();if(c.length===1&&c[0].cantidad===1){location.href='pagar-producto.html?sku='+encodeURIComponent(c[0].sku);return}document.getElementById('note').textContent='Tu carrito está guardado. Estamos habilitando el checkout unificado para varios productos sin alterar el pago seguro actual.'}
render();</script></body></html>
