<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | MIRED360</title><script src="https://checkout.bold.co/library/boldPaymentButton.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f5f8fc;font-family:system-ui,-apple-system,Segoe UI,Arial;color:#172033}.top{background:linear-gradient(135deg,#075bc8,#0b7aee);color:white;padding:18px}.bar,.wrap{max-width:650px;margin:auto}.back{color:white;text-decoration:none;font-size:26px}.card{background:white;border:1px solid #e2eaf3;border-radius:22px;padding:22px;margin-top:22px;box-shadow:0 8px 25px #173a6510}h1{margin:5px 0 8px}p{color:#6b7a8d}label{display:block;font-size:13px;font-weight:800;margin:15px 0 6px}input,select{width:100%;padding:14px;border:1.5px solid #dfe8f2;border-radius:13px;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.go{width:100%;padding:16px;border:0;border-radius:14px;background:#0874e8;color:#fff;font-weight:900;font-size:16px;margin-top:20px}.go:disabled{opacity:.6}.note{font-size:12px;text-align:center}.status{display:none;background:#eef7ff;padding:14px;border-radius:12px;margin-top:14px;color:#244b78}@media(max-width:520px){.row{grid-template-columns:1fr}}
</style></head><body><header class="top"><div class="bar"><a class="back" href="tienda.html">‹</a> <b>MIRED360SERVICIOS · CHECKOUT</b></div></header><main class="wrap"><div class="card"><h1>Prepara tu pedido</h1><p>Confirma los datos. Ningún servicio se ejecutará hasta que el pago esté aprobado.</p><form id="f">
<div class="row"><div><label>Servicio</label><select id="tipo"><option value="factura">Pago de factura</option><option value="pin">PIN / servicio digital</option><option value="paquete">Paquete móvil</option></select></div><div><label>Empresa / proveedor</label><input id="operador" required maxlength="40"></div></div>
<div class="row"><div><label>Referencia / número</label><input id="ref" required maxlength="40"></div><div><label>Valor</label><input id="valor" required type="number" min="1000" max="1000000" step="100"></div></div>
<div class="row"><div><label>Nombre</label><input id="nombre" required maxlength="100"></div><div><label>Celular</label><input id="tel" required inputmode="tel" maxlength="15"></div></div>
<label>Correo (opcional)</label><input id="email" type="email" maxlength="120">
<button id="go" class="go">Continuar al pago de prueba</button><p class="note">🔒 Modo Sandbox. No se ejecuta Practi ni se entrega ningún servicio real.</p><div id="status" class="status"></div></form></div></main>
<script>
const ENDPOINT="https://lpiusomsuswdcraoozdn.supabase.co/functions/v1/tienda-checkout-sandbox";
const q=new URLSearchParams(location.search);if(q.get("tipo"))document.getElementById("tipo").value=q.get("tipo");
const f=document.getElementById("f"),btn=document.getElementById("go"),s=document.getElementById("status"),tipoEl=document.getElementById("tipo"),operadorEl=document.getElementById("operador"),refEl=document.getElementById("ref"),valorEl=document.getElementById("valor"),nombreEl=document.getElementById("nombre"),telEl=document.getElementById("tel"),emailEl=document.getElementById("email");
f.onsubmit=async e=>{e.preventDefault();btn.disabled=true;s.style.display="block";s.textContent="Creando pedido seguro…";
try{const body={tipo:tipoEl.value,operador:operadorEl.value,referencia:refEl.value,valor:Number(valorEl.value),nombre:nombreEl.value,telefono:telEl.value,email:emailEl.value};
const r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||"No fue posible crear el pedido");
s.textContent="Pedido "+j.order.numero+" creado. Abriendo Bold Sandbox…";
new BoldCheckout(j.checkout).open();
}catch(err){s.textContent="No se pudo continuar: "+err.message;btn.disabled=false}}
</script></body></html>
