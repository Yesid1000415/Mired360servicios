<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestión de pedidos | MIRED360</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f9ff;color:#071a33;font-family:system-ui}header{background:#071a33;color:#fff;padding:18px}header a{color:#5fe2ff}main{max-width:1000px;margin:auto;padding:24px 16px}.card{background:#fff;border:1px solid #dce7f2;border-radius:18px;padding:22px;margin:16px 0}label{display:block;margin:12px 0 6px;font-weight:700}input,select,textarea,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #c9d8e7;max-width:100%}input,textarea{width:100%}button{background:#087bff;color:#fff;border:0;font-weight:800;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.filters,.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.filters label{margin-top:0}.pill{padding:6px 10px;border-radius:999px;background:#edf6ff;display:inline-block;margin:4px 6px 4px 0}.muted{color:#526277;font-size:.9rem}.paid{color:#12613a;background:#eaf9ef}#login{max-width:460px;margin:30px auto}#msg{min-height:24px}h2{font-size:1.15rem;overflow-wrap:anywhere}p{overflow-wrap:anywhere}a{color:#075bb6}li{margin:6px 0}[hidden]{display:none!important}</style></head><body><header><strong>MIRED360 · Gestión de pedidos</strong> <a href="index.html">Ver tienda</a></header><main><p id="msg" role="status" aria-live="polite"></p><section id="login" class="card"><h1>Tu panel privado</h1><p>Ingresa con tu cuenta de administración MIRED360.</p><form id="loginForm"><label for="email">Correo</label><input id="email" type="email" autocomplete="username" required><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required><button id="loginBtn" style="width:100%;margin-top:16px">Ingresar</button></form></section><section id="panel" hidden><div class="actions"><h1>Pedidos de la tienda</h1><button id="logout">Salir</button></div><div class="filters card"><div><label for="pago">Pago</label><select id="pago"><option value="">Todos</option><option value="pendiente">Pendiente</option><option value="aprobado">Aprobado</option><option value="rechazado">Rechazado</option></select></div><div><label for="entrega">Entrega</label><select id="entrega"><option value="">Todas</option><option value="pendiente">Pendiente</option><option value="procesando">En preparación</option><option value="entregado">Entregado</option><option value="fallido">Con novedad</option></select></div><button id="refresh">Actualizar</button></div><p id="count"></p><div id="orders"></div><div class="actions"><button id="prev">Anterior</button><button id="next">Siguiente</button></div></section></main><script>
const BASE='https://lpiusomsuswdcraoozdn.supabase.co',KEY='sb_publishable_ZFjdUsgyfSxOqm4L1SrJJg_Z2f0lL0r';let session=null,page=0;const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Number(n));try{session=JSON.parse(sessionStorage.getItem('mired360_shop_admin')||'null')}catch(_){}
function clear(){session=null;sessionStorage.removeItem('mired360_shop_admin');$('panel').hidden=true;$('login').hidden=false;$('orders').replaceChildren()}
async function token(){if(!session)throw new Error('Inicia sesión.');if(session.expires_at<Date.now()+30000){const r=await fetch(BASE+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});const d=await r.json();if(!r.ok){clear();throw new Error('La sesión venció. Ingresa de nuevo.')}session={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+d.expires_in*1000};sessionStorage.setItem('mired360_shop_admin',JSON.stringify(session))}return session.access_token}
async function api(body){const t=await token();const r=await fetch(BASE+'/functions/v1/tienda-admin-pedidos',{method:'POST',headers:{Authorization:'Bearer '+t,apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok){if(r.status===401||r.status===403)clear();throw new Error(d.error||d.message||'No fue posible consultar.')}return d}
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
async function load(){try{$('msg').textContent='Consultando pedidos…';const d=await api({action:'list',page,pago:$('pago').value,entrega:$('entrega').value});$('login').hidden=true;$('panel').hidden=false;$('count').textContent=d.count+' pedido(s) · Página '+(page+1);$('prev').disabled=page===0;$('next').disabled=(page+1)*d.limit>=d.count;$('orders').replaceChildren();if(!d.pedidos.length)$('orders').append(el('p','No hay pedidos con estos filtros.'));for(const p of d.pedidos){const card=el('article',undefined,'card');card.append(el('h2',p.numero_pedido),el('span','Pago: '+p.estado_pago,'pill '+(p.estado_pago==='aprobado'?'paid':'')),el('span','Entrega: '+p.estado_entrega,'pill'),el('p',p.cliente_nombre+' · '+p.cliente_telefono+' · '+(p.cliente_email||'Sin correo')),el('p',p.producto_nombre+' · '+money(p.valor)),el('p',new Date(p.creado_en).toLocaleString('es-CO'),'muted'));const ul=el('ul');for(const i of p.tienda_pedido_items||[])ul.append(el('li',i.cantidad+' × '+i.producto_nombre+' · '+money(i.subtotal)));card.append(ul);if(p.envio)card.append(el('p','Entrega: '+p.envio.ciudad+' · '+p.envio.direccion+(p.envio.complemento?' · '+p.envio.complemento:'')));const manageable=p.estado_pago==='aprobado'&&(p.producto_codigo==='CARRITO'||/^BOLD-(NEO|SONOQR|PLUS|SMART)/.test(p.producto_codigo||''));if(manageable){const form=el('form'),label=el('label','Estado de entrega'),select=el('select');label.htmlFor='estado-'+p.id;select.id=label.htmlFor;for(const [v,t] of [['pendiente','Pendiente'],['procesando','En preparación'],['entregado','Entregado'],['fallido','Con novedad']]){const op=el('option',t);op.value=v;op.selected=v===p.estado_entrega;select.append(op)}const noteLabel=el('label','Nota interna (opcional)'),note=el('textarea');noteLabel.htmlFor='nota-'+p.id;note.id=noteLabel.htmlFor;note.maxLength=500;const btn=el('button','Guardar entrega');btn.style.marginTop='12px';form.append(label,select,noteLabel,note,btn);form.onsubmit=async e=>{e.preventDefault();btn.disabled=true;try{await api({action:'update',id:p.id,estado:select.value,nota:note.value.trim(),version:p.actualizado_en});await load();$('msg').textContent='Estado de entrega actualizado.'}catch(err){$('msg').textContent=err.message;btn.disabled=false}};card.append(form)}else card.append(el('p','La gestión de entrega se habilita para datáfonos con pago aprobado.','muted'));$('orders').append(card)}$('msg').textContent=''}catch(err){$('msg').textContent=err.message}}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;try{const r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});const d=await r.json();if(!r.ok)throw new Error('Revisa tu correo y contraseña.');session={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+d.expires_in*1000};sessionStorage.setItem('mired360_shop_admin',JSON.stringify(session));$('password').value='';await load()}catch(err){$('msg').textContent=err.message}finally{$('loginBtn').disabled=false}};
$('logout').onclick=async()=>{try{if(session)await fetch(BASE+'/auth/v1/logout',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token}})}finally{clear();$('msg').textContent='Sesión cerrada.'}};
$('refresh').onclick=()=>{page=0;load()};$('pago').onchange=$('entrega').onchange=()=>{page=0;load()};$('prev').onclick=()=>{if(page>0){page--;load()}};$('next').onclick=()=>{page++;load()};if(session)load();
</script></body></html>
