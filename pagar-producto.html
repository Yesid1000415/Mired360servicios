<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagar | MIRED360SERVICIOS</title><script src="https://checkout.bold.co/library/boldPaymentButton.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f5f8fc;color:#142033}.wrap{max-width:620px;margin:auto;padding:28px 18px}.brand{font-weight:900;font-size:24px;color:#0866df;margin-bottom:25px}.card{background:#fff;border:1px solid #e5ebf3;border-radius:22px;padding:24px;box-shadow:0 10px 30px #102a4d12}h1{margin:0 0 8px}.price{font-size:32px;font-weight:900;margin:14px 0}.field{margin:13px 0}label{display:block;font-weight:750;margin-bottom:6px}input{width:100%;padding:13px;border:1px solid #ccd7e5;border-radius:12px;font-size:16px}button{width:100%;padding:14px;border:0;border-radius:13px;background:#0866df;color:#fff;font-weight:900;font-size:16px;margin-top:12px}.muted{color:#68758a;font-size:13px;line-height:1.4}.status{margin-top:14px;padding:12px;border-radius:12px;background:#eef6ff;display:none}</style></head><body><main class="wrap"><div class="brand">MIRED360SERVICIOS</div><section class="card"><h1 id="pn">Pago seguro MIRED360</h1><div id="pp" class="price">Valor validado por servidor</div><p class="muted">El valor del producto se valida directamente en MIRED360 y no puede modificarse desde esta página.</p><form id="f"><div class="field"><label>Nombre completo</label><input id="nombre" required minlength="3"></div><div class="field"><label>Celular</label><input id="telefono" required inputmode="tel"></div><div class="field"><label>Correo electrónico</label><input id="email" type="email" required maxlength="254"></div><div id="envio" hidden><h2>Entrega del datáfono</h2><div class="field"><label for="ciudad">Ciudad o municipio</label><input id="ciudad" minlength="3" maxlength="100"></div><div class="field"><label for="direccion">Dirección completa</label><input id="direccion" minlength="5" maxlength="200"></div><div class="field"><label for="complemento">Barrio, conjunto o apartamento (opcional)</label><input id="complemento" maxlength="200"></div><p class="muted">Entrega estimada: de 2 a 8 días hábiles, según ciudad o municipio.</p></div><button type="submit">Continuar al pago seguro</button></form><div id="s" class="status"></div><div id="bold"></div></section></main><script>
const ENDPOINT="https://lpiusomsuswdcraoozdn.supabase.co/functions/v1/bold-checkout-production";
const params=new URLSearchParams(location.search), beautyToken=params.get("beauty_token")||""; let sku=params.get("sku")||"BOLD-SONOQR-001";
const physical=!beautyToken&&/^BOLD-/.test(sku);
document.getElementById("envio").hidden=!physical;document.getElementById("ciudad").required=physical;document.getElementById("direccion").required=physical;
const form=document.getElementById("f"),statusBox=document.getElementById("s");
(async()=>{if(!beautyToken)return; try{const r=await fetch("https://lyefgbckvzfxkjjumvmp.supabase.co/rest/v1/rpc/resolve_checkout_token",{method:"POST",headers:{"apikey":"sb_publishable_9WL85w0XrKJwr1CMAHl6-w__n2-Ziix","Content-Type":"application/json"},body:JSON.stringify({p_token:beautyToken})}); const a=await r.json(); if(!r.ok||!a?.[0])throw 0; sku=a[0].plan_code; const em=document.getElementById("email"); em.value=a[0].buyer_email; em.readOnly=true; document.getElementById("pn").textContent="Plan MIRED360 Beauty";}catch(_){statusBox.style.display="block";statusBox.textContent="La sesión de compra venció. Regresa a MIRED360 Beauty y selecciona el plan nuevamente.";form.style.display="none"}})();
form.addEventListener("submit",async function(e){
 e.preventDefault(); statusBox.style.display="block"; statusBox.textContent="Preparando pago seguro…";
 try{
  const data={codigo:sku,nombre:document.getElementById("nombre").value.trim(),telefono:document.getElementById("telefono").value.trim(),email:document.getElementById("email").value.trim().toLowerCase(),beauty_token:beautyToken};
  let endpoint=ENDPOINT;
  if(physical){endpoint="https://lpiusomsuswdcraoozdn.supabase.co/functions/v1/carrito-checkout-production";data.items=[{sku,cantidad:1}];data.envio={ciudad:document.getElementById("ciudad").value.trim(),direccion:document.getElementById("direccion").value.trim(),complemento:document.getElementById("complemento").value.trim()};const fingerprint=JSON.stringify(data);let attempt;try{attempt=JSON.parse(sessionStorage.getItem("mired360_direct_attempt")||"null")}catch(_){}if(!attempt||attempt.fingerprint!==fingerprint)attempt={fingerprint,key:crypto.randomUUID()};sessionStorage.setItem("mired360_direct_attempt",JSON.stringify(attempt));data.checkout_key=attempt.key}
  const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
  const x=await r.json(); if(!r.ok||!x.ok) throw new Error(x.error||"No fue posible preparar el pago");
  const q=x.checkout; document.getElementById("pn").textContent=q.description||"Producto MIRED360"; document.getElementById("pp").textContent="$"+Number(q.amount).toLocaleString("es-CO")+" "+q.currency;
  localStorage.setItem("mired360_last_order",x.pedido.numero); localStorage.setItem("mired360_last_email",document.getElementById("email").value.trim().toLowerCase());
  form.style.display="none"; statusBox.textContent="Pedido "+x.pedido.numero+" creado. Abriendo pago seguro con Bold…";
  if(typeof window.BoldCheckout!=="function") throw new Error("No cargó la pasarela de Bold. Recarga la página.");
  const checkout=new window.BoldCheckout({orderId:q.orderId,currency:q.currency,amount:q.amount,apiKey:q.apiKey,integritySignature:q.integritySignature,description:q.description,redirectionUrl:q.redirectionUrl});
  const pay=document.createElement("button"); pay.type="button"; pay.textContent="Pagar $"+Number(q.amount).toLocaleString("es-CO")+" con Bold"; pay.addEventListener("click",()=>checkout.open()); document.getElementById("bold").replaceChildren(pay); checkout.open();
 }catch(err){statusBox.textContent=err instanceof Error?err.message:"Error preparando el pago";}
});
</script></body></html>
