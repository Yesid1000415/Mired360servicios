function cartHtml(){let lines=Object.entries(cart).map(([id,qty])=>({...data.products.find(p=>p.id===Number(id)),qty})).filter(x=>x.id),total=lines.reduce((s,x)=>s+x.price*x.qty,0);return `<div class="drawerMask" data-action="toggleCart"></div><aside class="cartDrawer"><div class="row between"><div><span class="cap">TU COMPRA</span><h2>Tu pedido (${lines.reduce((s,x)=>s+x.qty,0)})</h2></div><button class="btn sm" data-action="toggleCart">${i('close')}</button></div><div class="cartRows">${lines.map(x=>`<div class="cartRow"><div class="thumb">${escape(x.emoji)}</div><div style="flex:1"><h4>${escape(x.name)}</h4><div class="small b">${money(x.price*x.qty)}</div><div class="qty"><button data-action="decrease:${x.id}">${i('minus')}</button><span class="small b">${x.qty}</span><button data-action="increase:${x.id}">${i('plus')}</button></div></div><button class="btn sm warn" data-action="remove:${x.id}">${i('trash')}</button></div>`).join('')||`<div class="empty" style="padding-top:55px">${i('bag')}<h3>Tu carrito está vacío</h3><p>Agrega productos para comenzar tu pedido.</p></div>`}</div><div class="cartTotal"><div class="row between mb18"><strong>Subtotal</strong><h2>${money(total)}</h2></div><button class="btn primary w100" data-action="checkout" ${!lines.length?'disabled':''}>Continuar con mi pedido ${i('arrow')}</button><p class="muted small t-center" style="margin-top:11px">Pedido de prueba · No se cobran pagos en esta versión.</p></div></aside>`}

if(m.type==='product'){let x=m.id?data.products.find(x=>x.id===m.id):{name:'',price:'',category:'Internet hogar',emoji:'📦',badge:'',stock:0,type:'Producto',active:true};title=m.id?'Editar producto':'Nuevo producto';inner=`<form id="productForm"><div class="formGrid">${field('Nombre del producto','name',x.name)}${field('Precio en COP','price',x.price,'number')}${field('Categoría','category',x.category)}${field('Emoji o ícono','emoji',x.emoji)}${field('Etiqueta (opcional)','badge',x.badge,'text',false)}${field('Existencias (productos físicos)','stock',x.stock,'number')}<div class="field"><label>Tipo</label><select name="type"><option ${x.type==='Producto'?'selected':''}>Producto</option><option ${x.type==='Servicio'?'selected':''}>Servicio</option></select></div><div class="field"><label>Visibilidad</label><select name="active"><option value="true" ${x.active?'selected':''}>Visible</option><option value="false" ${!x.active?'selected':''}>Oculto</option></select></div></div><button class="btn primary w100" type="submit" style="margin-top:20px">${i('check')} Guardar producto</button></form>`}
else if(m.type==='branch'){let x=m.id?branch(m.id):{name:'',city:'',wa:data.settings.wa,active:true};title=m.id?'Editar sucursal':'Nueva sucursal';inner=`<form id="branchForm"><div class="formGrid">${field('Nombre de sucursal','name',x.name)}${field('Ciudad o ubicación','city',x.city)}${field('WhatsApp de atención','wa',x.wa)}<div class="field"><label>Estado</label><select name="active"><option value="true" ${x.active?'selected':''}>Activa</option><option value="false" ${!x.active?'selected':''}>Inactiva</option></select></div></div><button type="submit" class="btn primary w100" style="margin-top:21px">${i('check')} Guardar sucursal</button></form>`}
else if(m.type==='advisor'){let x=m.id?advisor(m.id):{name:'',branch:data.branches[0]?.id,wa:data.settings.wa,rate:10,active:true};title=m.id?'Editar asesor':'Nuevo asesor';inner=`<form id="advisorForm"><div class="formGrid">${field('Nombre del asesor','name',x.name)}${field('WhatsApp de atención','wa',x.wa)}<div class="field"><label>Sucursal asignada</label><select name="branch">${data.branches.map(b=>`<option value="${b.id}" ${x.branch===b.id?'selected':''}>${escape(b.name)}</option>`).join('')}</select></div>${field('Comisión referencial (%)','rate',x.rate,'number')}<div class="field full"><label>Estado</label><select name="active"><option value="true" ${x.active?'selected':''}>Activo</option><option value="false" ${!x.active?'selected':''}>Inactivo</option></select></div></div><button type="submit" class="btn primary w100" style="margin-top:21px">${i('check')} Guardar asesor</button></form>`}
else if(m.type==='order'){let x=data.orders.find(x=>x.id===m.id);title='Pedido '+x.id;inner=`<div class="row between mb18"><span class="muted small">${escape(x.created)}</span>${chip(x.status)}</div><div class="formGrid"><div><div class="cap">CLIENTE</div><strong>${escape(x.client)}</strong><p class="muted small">${escape(x.phone)} · ${escape(x.city)}</p><p class="muted small">${escape(x.address||'')}</p></div><div><div class="cap">ATRIBUCIÓN</div><strong>${escape(branch(x.branch)?.name||'Venta directa')}</strong><p class="muted small">${escape(advisor(x.advisor)?.name||'Sin asesor')}</p></div></div><div class="hline"></div>${x.items.map(z=>`<div class="row between" style="padding:7px 0"><span class="small">${z.qty} × ${escape(z.name)}</span><strong class="small">${money(z.price*z.qty)}</strong></div>`).join('')}<div class="hline"></div><div class="row between mb18"><b>TOTAL</b><h2>${money(x.total)}</h2></div><form id="orderStatus"><div class="field"><label>Estado del pedido</label><select name="status">${['Pendiente','En proceso','Completado','Cancelado'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></div><button class="btn primary w100" style="margin-top:15px" type="submit">Actualizar estado</button></form>`}
else if(m.type==='checkout'||m.type==='manual'){title=m.type==='checkout'?'Finalizar pedido':'Registrar pedido manual';inner=`<div class="note mb18">${i('shield')} Usa datos ficticios: este registro de prueba solo aparecerá en este navegador. La versión final guardará el pedido en línea.</div><form id="checkoutForm"><div class="formGrid">${field('Nombre del cliente','client')}${field('Número celular','phone','','tel')}${field('Ciudad','city')}${field('Dirección / barrio','address','','text',false)}<div class="field full"><label>Observaciones</label><textarea name="note" placeholder="Detalles de entrega o cobertura"></textarea></div>${m.type==='manual'?`<div class="field"><label>Producto</label><select name="product">${data.products.map(x=>`<option value="${x.id}">${escape(x.name)} — ${money(x.price)}</option>`).join('')}</select></div><div class="field"><label>Sucursal</label><select name="branch">${data.branches.map(x=>`<option value="${x.id}">${escape(x.name)}</option>`).join('')}</select></div>`:''}</div><button type="submit" class="btn primary w100" style="margin-top:21px">${i('check')} ${m.type==='checkout'?'Registrar pedido y abrir WhatsApp':'Registrar pedido'}</button></form>`}
return `<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true"><div class="modalHeader"><h2>${title}</h2><button data-action="closeModal" class="btn sm">${i('close')}</button></div><div class="modalBody">${inner}</div>${footer}</div></div>`}
function bindForms(){for(let [id,handler] of [['settingsForm',saveSettings],['productForm',saveProduct],['branchForm',saveBranch],['advisorForm',saveAdvisor],['orderStatus',saveOrderStatus],['checkoutForm',saveCheckout]]){$('#'+id)?.addEventListener('submit',e=>{e.preventDefault();handler(new FormData(e.target))})}$('#search')?.addEventListener('input',e=>{search=e.target.value;let f=document.activeElement;let pos=f.selectionStart;render();let inp=$('#search');inp?.focus();inp?.setSelectionRange(pos,pos)});$('#storeSearchInput')?.addEventListener('input',e=>{search=e.target.value;render();let inp=$('#storeSearchInput');inp?.focus()});$('#statusFilter')?.addEventListener('change',e=>{filter=e.target.value;render()});$('#roleSelect')?.addEventListener('change',e=>{role=e.target.value;view='dashboard';search='';filter='';render();toast('Vista de '+roleName()+' · Solo simulación, no es acceso seguro')})}
function saveSettings(f){data.settings=Object.fromEntries(f.entries());persist();toast('Cambios guardados');render()}
function saveProduct(f){let d=Object.fromEntries(f.entries());let o={name:d.name,price:Math.max(0,Number(d.price)),category:d.category,emoji:d.emoji||'📦',badge:d.badge||'',stock:Math.max(0,Number(d.stock)),type:d.type,active:d.active==='true'};if(modal.id){Object.assign(data.products.find(x=>x.id===modal.id),o)}else{data.products.unshift({id:Math.max(0,...data.products.map(x=>x.id))+1,...o})}modal=null;persist();toast('Producto guardado');render()}
function saveBranch(f){let d=Object.fromEntries(f.entries()),o={name:d.name,city:d.city,wa:d.wa.replace(/\D/g,''),active:d.active==='true'};if(modal.id){Object.assign(branch(modal.id),o)}else{data.branches.push({id:Math.max(0,...data.branches.map(x=>x.id))+1,...o})}modal=null;persist();toast('Sucursal guardada');render()}
function saveAdvisor(f){let d=Object.fromEntries(f.entries()),o={name:d.name,wa:d.wa.replace(/\D/g,''),branch:Number(d.branch),rate:Math.min(100,Math.max(0,Number(d.rate))),active:d.active==='true'};if(modal.id){Object.assign(advisor(modal.id),o)}else{data.advisors.push({id:Math.max(0,...data.advisors.map(x=>x.id))+1,...o})}modal=null;persist();toast('Asesor guardado');render()}
function saveOrderStatus(f){data.orders.find(x=>x.id===modal.id).status=f.get('status');modal=null;persist();toast('Estado actualizado');render()}
function saveCheckout(f){let d=Object.fromEntries(f.entries()),items,branchId,advisorId;if(modal.type==='manual'){let p=data.products.find(x=>x.id===Number(d.product));items=[{id:p.id,name:p.name,price:p.price,qty:1}];branchId=Number(d.branch);advisorId=null}else{items=Object.entries(cart).map(([id,qty])=>{let p=data.products.find(x=>x.id===Number(id));return p?{id:p.id,name:p.name,price:p.price,qty}:null}).filter(Boolean);branchId=branchFromLink||data.branches[0]?.id||null;advisorId=advisorFromLink||null}if(!items.length){toast('Agrega un producto');return}let id='MD-'+(1000+Math.max(0,...data.orders.map(x=>Number(x.id.replace(/\D/g,''))-1000))+1);let o={id,client:d.client,phone:d.phone,city:d.city,address:d.address,note:d.note||'',branch:branchId,advisor:advisorId,status:'Pendiente',created:new Date().toISOString().slice(0,10),items,total:items.reduce((s,x)=>s+x.price*x.qty,0)};data.orders.push(o);let wasCheckout=modal.type==='checkout';cart={};cartOpen=false;modal=null;persist();render();toast('Pedido '+id+' guardado en este navegador');if(wasCheckout){let phone=(advisor(advisorId)?.wa||branch(branchId)?.wa||data.settings.wa).replace(/\D/g,'');let msg=`Hola, quiero confirmar mi solicitud *${id}*\nCliente: ${o.client}\nCelular: ${o.phone}\nCiudad: ${o.city}\nDirección: ${o.address||'Por confirmar'}\n${items.map(x=>`- ${x.qty} x ${x.name} (${money(x.price*x.qty)})`).join('\n')}\n*Total estimado: ${money(o.total)}*\nSujeto a verificación de cobertura, disponibilidad y condiciones.\nObservaciones: ${o.note||'Ninguna'}`;let url='https://wa.me/'+phone+'?text='+encodeURIComponent(msg);let w=window.open(url,'_blank','noopener,noreferrer');if(!w){toast('Pedido registrado. Activa ventanas emergentes para abrir WhatsApp.')}}else{view='orders';render()}}
async function copy(txt){try{await navigator.clipboard.writeText(txt);toast('Enlace copiado al portapapeles')}catch(e){prompt('Copia este enlace:',txt)}}
function action(act){if(act==='downloadReport'){downloadReport();return}if(act.startsWith('nav:')){view=act.slice(4);if(role!=='owner'&&!['dashboard','orders','customers'].includes(view))view='dashboard';search='';filter='';mobileNav=false;render();return}if(act.startsWith('addCart:')){let id=Number(act.split(':')[1]);cart[id]=(cart[id]||0)+1;toast('Añadido al carrito');render();return}if(act.startsWith('increase:')||act.startsWith('decrease:')||act.startsWith('remove:')){let [a,id]=act.split(':');id=Number(id);if(a==='increase')cart[id]=(cart[id]||0)+1;if(a==='decrease')cart[id]=Math.max(0,(cart[id]||0)-1);if(a==='remove')delete cart[id];if(!cart[id])delete cart[id];render();return}if(act.startsWith('linkBranch:'))return copy(linkFor(Number(act.split(':')[1]),null));if(act.startsWith('linkAdvisor:')){let a=advisor(Number(act.split(':')[1]));return copy(linkFor(a.branch,a.id))}if(act.startsWith('product:'))modal={type:'product',id:Number(act.split(':')[1])};else if(act.startsWith('branch:'))modal={type:'branch',id:Number(act.split(':')[1])};else if(act.startsWith('advisor:'))modal={type:'advisor',id:Number(act.split(':')[1])};else if(act.startsWith('order:'))modal={type:'order',id:act.slice(6)};else if(act==='newProduct')modal={type:'product'};else if(act==='newBranch')modal={type:'branch'};else if(act==='newAdvisor')modal={type:'advisor'};else if(act==='newOrder')modal={type:'manual'};else if(act==='checkout'){cartOpen=false;modal={type:'checkout'}}else if(act==='closeModal')modal=null;else if(act==='store'){mode='store';view='dashboard';search='';mobileNav=false;window.scrollTo(0,0)}else if(act==='admin'){mode='admin';cartOpen=false;search='';window.scrollTo(0,0)}else if(act==='menu'){mobileNav=!mobileNav}else if(act==='toggleCart'){cartOpen=!cartOpen}else if(act==='gotoProducts'){document.getElementById('products')?.scrollIntoView({behavior:'smooth'});return}else if(act==='gotoBenefits'){document.getElementById('benefits')?.scrollIntoView({behavior:'smooth'});return}else if(act==='contact'){window.open('https://wa.me/'+data.settings.wa.replace(/\D/g,''),'_blank','noopener,noreferrer');return}else if(act==='toggleSearch'){$('#storeSearch')?.classList.toggle('hide');$('#storeSearchInput')?.focus();return}else if(act==='notifications'){toast('Notificaciones reales disponibles al conectar la base de datos');return}render()}
function downloadReport(){let rows=visibleOrders(),escapeCSV=v=>{let s=String(v??'');if(/^[=+@\-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'},columns=['Pedido','Fecha','Cliente','Celular','Ciudad','Sucursal','Asesor','Estado','Total COP'],csv=[columns,...rows.map(x=>[x.id,x.created,x.client,x.phone,x.city,branch(x.branch)?.name||'',advisor(x.advisor)?.name||'',x.status,x.total])].map(r=>r.map(escapeCSV).join(',')).join('\r\n'),blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='MIRED360_VENTAS_DEMO.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Reporte de demostración exportado')}
document.addEventListener('click',e=>{let a=e.target.closest('[data-action]');if(a){e.preventDefault();action(a.dataset.action)}let nav=e.target.closest('[data-nav]');if(nav){view=nav.dataset.nav;if(role!=='owner'&&!['dashboard','orders','customers'].includes(view))view='dashboard';mobileNav=false;search='';filter='';render()}let catBtn=e.target.closest('[data-category]');if(catBtn){cat=catBtn.dataset.category;render()}if(e.target.id==='scrim'){modal=null;render()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(modal||cartOpen)){modal=null;cartOpen=false;render()}});
render();
})();
