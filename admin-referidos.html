<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración Referidos | MIRED360</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#071a32;font-family:Arial,sans-serif}.top{background:#071a32;color:white;padding:17px}.top b{font-size:22px}.wrap{max-width:1000px;margin:auto;padding:20px 14px}.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 7px 22px #10284612}.auth{max-width:460px;margin:35px auto}.field{width:100%;padding:14px;border:1px solid #ccd6e3;border-radius:12px;margin:6px 0 12px;font-size:16px}button,.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:800;cursor:pointer}.primary{background:#ef171d;color:#fff;width:100%}.secondary{background:#eaf2ff;color:#0754b8}.danger{background:#fff0f0;color:#bd1010}.hide{display:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#fff;border-radius:15px;padding:16px}.num{font-size:24px;font-weight:900;color:#0754b8}.item{border:1px solid #e5eaf1;border-radius:14px;padding:15px;margin:10px 0}.row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.muted{color:#6a7788;font-size:13px}.tag{background:#eaf2ff;padding:6px 9px;border-radius:18px;font-size:12px;font-weight:800}select{padding:9px;border:1px solid #ccd6e3;border-radius:9px}.msg{font-weight:700;margin:10px 0}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.row.actions{align-items:stretch}.row.actions>*{flex:1}}</style></head><body>
<header class="top"><b>MIRED360</b> · Administración de Referidos</header><main class="wrap">
<section id="auth" class="card auth"><h1>Panel administrativo</h1><p>Acceso exclusivo MIRED360SERVICIOS.</p><label>Correo administrador</label><input id="email" class="field" type="email" value="ventas@mired360servicios.com"><label>Contraseña</label><input id="pass" class="field" type="password" minlength="8" placeholder="Mínimo 8 caracteres"><button id="login" class="primary">INGRESAR</button><div class="row" style="margin-top:12px"><button id="crear" class="secondary">Crear mi acceso</button><button id="reset" class="secondary">Olvidé mi contraseña</button></div><div id="authmsg" class="msg"></div></section>
<section id="dash" class="hide"><div class="card"><div class="row"><div><div class="muted">Administrador</div><h1 style="margin:4px 0">Programa Refiere y Gana</h1></div><button id="logout" class="secondary">Cerrar sesión</button></div></div>
<div class="stats"><div class="stat"><div id="sref" class="num">0</div>Referidores</div><div class="stat"><div id="scli" class="num">0</div>Referidos</div><div class="stat"><div id="sins" class="num">0</div>Instalados</div><div class="stat"><div id="spag" class="num">$0</div>Pagado</div></div>
<div class="card"><h2>Referidores registrados</h2><div id="referidores"></div></div><div class="card"><h2>Clientes referidos</h2><div id="clientes"></div></div></section></main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://lpiusomsuswdcraoozdn.supabase.co','sb_publishable_ZFjdUsgyfSxOqm4L1SrJJg_Z2f0lL0r');
const $=id=>document.getElementById(id), money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function autorizado(){const{data:{user}}=await sb.auth.getUser();if(!user)return false;const{data}=await sb.from('admin_referidos').select('email').maybeSingle();return !!data}
async function entrar(){const email=$('email').value.trim(),password=$('pass').value;const{error}=await sb.auth.signInWithPassword({email,password});if(error){$('authmsg').textContent='No fue posible ingresar. Revisa correo y contraseña.';return}await mostrar()}
async function crear(){const email=$('email').value.trim(),password=$('pass').value;if(email.toLowerCase()!=='ventas@mired360servicios.com'){$('authmsg').textContent='Este correo no está autorizado como administrador.';return}if(password.length<8){$('authmsg').textContent='La contraseña debe tener mínimo 8 caracteres.';return}const{error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+'/admin-referidos.html'}});$('authmsg').textContent=error?error.message:'Acceso creado. Revisa el correo para confirmar la cuenta y luego inicia sesión.'}
async function reset(){const email=$('email').value.trim();const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/admin-referidos.html?recovery=1'});$('authmsg').textContent=error?error.message:'Te enviamos al correo el enlace para recuperar tu contraseña.'}
async function mostrar(){if(!await autorizado()){await sb.auth.signOut();$('authmsg').textContent='Cuenta sin permisos administrativos.';return}$('auth').classList.add('hide');$('dash').classList.remove('hide');await cargar()}
async function cargar(){const[{data:r},{data:c}]=await Promise.all([sb.from('referidores').select('id,codigo,nombre,correo,whatsapp,estado,created_at').order('created_at',{ascending:false}),sb.from('referidos_internet').select('*').order('created_at',{ascending:false})]);const rr=r||[],cc=c||[];$('sref').textContent=rr.length;$('scli').textContent=cc.length;$('sins').textContent=cc.filter(x=>['instalado','pago disponible','pagado'].includes(x.estado)).length;$('spag').textContent=money(cc.filter(x=>x.estado==='pagado').reduce((a,x)=>a+(x.valor_comision||0),0));
$('referidores').innerHTML=rr.length?rr.map(x=>`<div class="item"><div class="row"><div><strong>${esc(x.nombre)}</strong><div class="muted">${esc(x.codigo)} · ${esc(x.correo)} · ${esc(x.whatsapp)}</div></div><span class="tag">${esc(x.estado)}</span></div><div class="row actions" style="margin-top:10px"><button class="secondary" data-block="${x.id}" data-state="${x.estado}">${x.estado==='activo'?'Bloquear':'Activar'}</button><button class="danger" data-delr="${x.id}" data-code="${esc(x.codigo)}">Eliminar</button></div></div>`).join(''):'<p>No hay referidores.</p>';
$('clientes').innerHTML=cc.length?cc.map(x=>`<div class="item"><div class="row"><div><strong>${esc(x.nombre_referido)}</strong><div class="muted">${esc(x.ciudad)} · Referidor: ${esc(x.referidor_codigo)}</div></div><select data-status="${x.id}">${['recibido','contactado','venta','instalado','pago disponible','pagado'].map(s=>`<option ${s===x.estado?'selected':''}>${s}</option>`).join('')}</select></div><div class="row" style="margin-top:8px"><span>Comisión: <strong>${money(x.valor_comision)}</strong></span><button class="danger" data-delc="${x.id}">Eliminar</button></div></div>`).join(''):'<p>No hay clientes referidos.</p>';bind()}
function bind(){document.querySelectorAll('[data-block]').forEach(b=>b.onclick=async()=>{await sb.from('referidores').update({estado:b.dataset.state==='activo'?'bloqueado':'activo'}).eq('id',b.dataset.block);cargar()});document.querySelectorAll('[data-status]').forEach(s=>s.onchange=async()=>{const v=s.value,u={estado:v};if(v==='instalado')u.fecha_instalacion=new Date().toISOString().slice(0,10);if(v==='pagado')u.fecha_pago=new Date().toISOString().slice(0,10);await sb.from('referidos_internet').update(u).eq('id',s.dataset.status);cargar()});document.querySelectorAll('[data-delc]').forEach(b=>b.onclick=async()=>{if(confirm('¿Eliminar este referido?')){await sb.from('referidos_internet').delete().eq('id',b.dataset.delc);cargar()}});document.querySelectorAll('[data-delr]').forEach(b=>b.onclick=async()=>{if(confirm('¿Eliminar este referidor y sus registros asociados?')){await sb.from('referidos_internet').delete().eq('referidor_codigo',b.dataset.code);await sb.from('referidores').delete().eq('id',b.dataset.delr);cargar()}})}
$('login').onclick=entrar;$('crear').onclick=crear;$('reset').onclick=reset;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
sb.auth.onAuthStateChange(async(event)=>{if(event==='PASSWORD_RECOVERY'){const p=prompt('Escribe tu nueva contraseña (mínimo 8 caracteres):');if(p&&p.length>=8){const{error}=await sb.auth.updateUser({password:p});alert(error?error.message:'Contraseña actualizada.')}}});
if((await sb.auth.getSession()).data.session)mostrar();
</script></body></html>
